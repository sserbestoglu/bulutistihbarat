<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="cloudG" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="55%" stop-color="#1565c0"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </radialGradient>
    <radialGradient id="cloudGloss" cx="45%" cy="30%" r="55%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <linearGradient id="eyeLid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d0d8e8"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#8899bb"/>
    </linearGradient>
    <radialGradient id="irisG" cx="38%" cy="35%" r="62%">
      <stop offset="0%" stop-color="#64c8ff"/>
      <stop offset="45%" stop-color="#1a6fd4"/>
      <stop offset="100%" stop-color="#0b3a8a"/>
    </radialGradient>
    <radialGradient id="pupilG" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#112244"/>
      <stop offset="100%" stop-color="#000a1e"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Cloud bumps -->
  <circle cx="72" cy="102" r="36" fill="url(#cloudG)"/>
  <circle cx="100" cy="88" r="42" fill="url(#cloudG)"/>
  <circle cx="130" cy="100" r="32" fill="url(#cloudG)"/>
  <!-- Cloud body -->
  <rect x="36" y="110" width="128" height="40" rx="20" fill="url(#cloudG)"/>
  <!-- Cloud gloss -->
  <ellipse cx="95" cy="90" rx="36" ry="18" fill="url(#cloudGloss)"/>
  <!-- Eye lid -->
  <path d="M30 118 Q100 72 170 118 Q100 164 30 118Z" fill="url(#eyeLid)" filter="url(#glow)"/>
  <!-- Iris -->
  <circle cx="100" cy="118" r="26" fill="url(#irisG)"/>
  <circle cx="100" cy="118" r="26" fill="none" stroke="#3aa8ff" stroke-width="1.5" opacity="0.6"/>
  <!-- Pupil -->
  <circle cx="100" cy="118" r="13" fill="url(#pupilG)"/>
  <!-- Highlight -->
  <ellipse cx="93" cy="111" rx="6" ry="4" fill="rgba(255,255,255,0.75)" transform="rotate(-20,93,111)"/>
  <ellipse cx="88" cy="108" rx="2.5" ry="1.5" fill="rgba(255,255,255,0.5)"/>
</svg>
