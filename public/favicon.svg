<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="#0d2d4a"/>
  <rect width="512" height="512" rx="110" fill="url(#bg_grad)"/>

  <!-- Outer ring -->
  <circle cx="220" cy="220" r="130" stroke="rgba(255,255,255,0.55)" stroke-width="18" fill="none"/>
  <!-- Middle ring -->
  <circle cx="220" cy="220" r="72" stroke="rgba(255,255,255,0.2)" stroke-width="10" fill="none"/>

  <!-- Crosshair lines -->
  <!-- Left -->
  <line x1="60" y1="220" x2="130" y2="220" stroke="rgba(255,255,255,0.7)" stroke-width="16" stroke-linecap="round"/>
  <!-- Right -->
  <line x1="310" y1="220" x2="380" y2="220" stroke="rgba(255,255,255,0.7)" stroke-width="16" stroke-linecap="round"/>
  <!-- Top -->
  <line x1="220" y1="60" x2="220" y2="130" stroke="rgba(255,255,255,0.7)" stroke-width="16" stroke-linecap="round"/>
  <!-- Bottom -->
  <line x1="220" y1="310" x2="220" y2="380" stroke="rgba(255,255,255,0.7)" stroke-width="16" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="220" cy="220" r="26" fill="white"/>

  <!-- Handle / magnifier stem -->
  <line x1="318" y1="318" x2="440" y2="440" stroke="white" stroke-width="36" stroke-linecap="round"/>

  <!-- Gradient defs -->
  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a3461"/>
      <stop offset="100%" stop-color="#0a1e42"/>
    </linearGradient>
  </defs>
</svg>
