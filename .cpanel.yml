---
deployment:
  tasks:
    - chmod -R 755 /home2/bulutist/repositories/bulutistihbarat/storage
    - chmod -R 755 /home2/bulutist/repositories/bulutistihbarat/bootstrap/cache
    - /bin/ln -sfn /home2/bulutist/repositories/bulutistihbarat/public /home2/bulutist/public_html
    - cp -n /home2/bulutist/repositories/bulutistihbarat/.env.example /home2/bulutist/repositories/bulutistihbarat/.env
    - /opt/cpanel/ea-php83/root/usr/bin/php /home2/bulutist/repositories/bulutistihbarat/artisan config:clear
    - /opt/cpanel/ea-php83/root/usr/bin/php /home2/bulutist/repositories/bulutistihbarat/artisan cache:clear
    - /opt/cpanel/ea-php83/root/usr/bin/php /home2/bulutist/repositories/bulutistihbarat/artisan route:clear
    - /opt/cpanel/ea-php83/root/usr/bin/php /home2/bulutist/repositories/bulutistihbarat/artisan view:clear
    - /opt/cpanel/ea-php83/root/usr/bin/php /home2/bulutist/repositories/bulutistihbarat/artisan storage:link --force
    - /opt/cpanel/ea-php83/root/usr/bin/php /home2/bulutist/repositories/bulutistihbarat/artisan optimize
