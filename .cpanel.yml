---
deployment:
  tasks:
    - find /home2/bulutist/repositories/bulutistihbarat/storage -type d -exec chmod 755 {} \;
    - find /home2/bulutist/repositories/bulutistihbarat/bootstrap/cache -type d -exec chmod 755 {} \;
    - cp -n /home2/bulutist/repositories/bulutistihbarat/.env.example /home2/bulutist/repositories/bulutistihbarat/.env
    - /usr/local/bin/php /home2/bulutist/repositories/bulutistihbarat/artisan config:clear
    - /usr/local/bin/php /home2/bulutist/repositories/bulutistihbarat/artisan cache:clear
    - /usr/local/bin/php /home2/bulutist/repositories/bulutistihbarat/artisan route:clear
    - /usr/local/bin/php /home2/bulutist/repositories/bulutistihbarat/artisan view:clear
    - /usr/local/bin/php /home2/bulutist/repositories/bulutistihbarat/artisan migrate --force
    - /usr/local/bin/php /home2/bulutist/repositories/bulutistihbarat/artisan storage:link --force
    - /usr/local/bin/php /home2/bulutist/repositories/bulutistihbarat/artisan optimize
