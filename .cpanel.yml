---
deployment:
  tasks:
    - find /home2/bulutist/repositories/bulutistihbarat/storage -type d -exec chmod 755 {} \;
    - find /home2/bulutist/repositories/bulutistihbarat/bootstrap/cache -type d -exec chmod 755 {} \;
    - /usr/local/bin/php /home2/bulutist/repositories/bulutistihbarat/artisan migrate --force
    - /usr/local/bin/php /home2/bulutist/repositories/bulutistihbarat/artisan storage:link --force
    - /usr/local/bin/php /home2/bulutist/repositories/bulutistihbarat/artisan optimize:clear
    - /usr/local/bin/php /home2/bulutist/repositories/bulutistihbarat/artisan optimize
    - cp /home2/bulutist/repositories/bulutistihbarat/public_html_index.php /home2/bulutist/public_html/index.php
    - cp /home2/bulutist/repositories/bulutistihbarat/public_html_htaccess /home2/bulutist/public_html/.htaccess
    - rm -rf /home2/bulutist/public_html/build
    - cp -r /home2/bulutist/repositories/bulutistihbarat/public/build /home2/bulutist/public_html/build
    - /bin/ln -sfn /home2/bulutist/repositories/bulutistihbarat/public/storage /home2/bulutist/public_html/storage
